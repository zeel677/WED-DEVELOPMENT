
<!DOCTYPE html>
<html data-bs-theme="dark" lang="en">
<head>

    <title>Bootstrap Example</title>

    <!-- ================= BOOTSTRAP CSS ================= -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>


    <!-- ==================================================
                         1. MODAL
    ================================================== -->

    <div class="text-center mt-5">

        <button class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#welcomeModal">

            Open Welcome Popup

        </button>

    </div>


    <!-- MODAL -->

    <div class="modal fade" id="welcomeModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">


                <!-- MODAL HEADER -->

                <div class="modal-header">

                    <h5 class="modal-title">
                        Welcome
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>


                <!-- MODAL BODY -->

                <div class="modal-body text-center">

                    <h3>Welcome to Bootstrap</h3>

                    <p>
                        This is a Bootstrap popup.
                    </p>

                </div>


                <!-- MODAL FOOTER -->

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                        Close

                    </button>

                </div>


            </div>

        </div>

    </div>



    <!-- ==================================================
                         2. SLIDER
    ================================================== -->

    <div class="container mt-5">

        <h3 class="text-center">
            Image Slider
        </h3>


        <!-- CAROUSEL -->

        <div id="mySlider"
             class="carousel slide"
             data-bs-ride="carousel">


            <!-- SLIDES -->

            <div class="carousel-inner">


                <!-- SLIDE 1 -->

                <div class="carousel-item active">

                    <img src="https://picsum.photos/id/1015/1000/400"
                         class="d-block w-100"
                         alt="Slide 1">

                </div>


                <!-- SLIDE 2 -->

                <div class="carousel-item">

                    <img src="https://picsum.photos/id/1016/1000/400"
                         class="d-block w-100"
                         alt="Slide 2">

                </div>


                <!-- SLIDE 3 -->

                <div class="carousel-item">

                    <img src="https://picsum.photos/id/1018/1000/400"
                         class="d-block w-100"
                         alt="Slide 3">

                </div>


            </div>


            <!-- PREVIOUS BUTTON -->

            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#mySlider"
                    data-bs-slide="prev">

                <span class="carousel-control-prev-icon">
                </span>

            </button>


            <!-- NEXT BUTTON -->

            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#mySlider"
                    data-bs-slide="next">

                <span class="carousel-control-next-icon">
                </span>

            </button>


        </div>

    </div>



    <!-- ==================================================
                       3. ACCORDION
    ================================================== -->

    <div class="container mt-5">

        <h3>
            Frequency
        </h3>


        <!-- ACCORDION -->

        <div class="accordion"
             id="frequencyAccordion">


            <!-- ================= FREQUENCY 1 ================= -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button class="accordion-button"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#frequency1">

                        Frequency 1

                    </button>

                </h2>


                <div id="frequency1"
                     class="accordion-collapse collapse show"
                     data-bs-parent="#frequencyAccordion">

                    <div class="accordion-body">

                        This is information about Frequency 1.

                    </div>

                </div>

            </div>



            <!-- ================= FREQUENCY 2 ================= -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button class="accordion-button collapsed"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#frequency2">

                        Frequency 2

                    </button>

                </h2>


                <div id="frequency2"
                     class="accordion-collapse collapse"
                     data-bs-parent="#frequencyAccordion">

                    <div class="accordion-body">

                        This is information about Frequency 2.

                    </div>

                </div>

            </div>



            <!-- ================= FREQUENCY 3 ================= -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button class="accordion-button collapsed"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#frequency3">

                        Frequency 3

                    </button>

                </h2>


                <div id="frequency3"
                     class="accordion-collapse collapse"
                     data-bs-parent="#frequencyAccordion">

                    <div class="accordion-body">

                        This is information about Frequency 3.

                    </div>

                </div>

            </div>


        </div>

    </div>



    <!-- ==================================================
                    BOOTSTRAP JAVASCRIPT
    ================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>
</html>
